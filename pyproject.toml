[build-system]
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "dspy-jev"
version = "0.1.0"
description = "Calibrated, probability-backed decisions for agent harnesses, built on DSPy Jev decision types."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "dspy-jev maintainers" }]
keywords = ["dspy", "jev", "decision", "llm", "agents", "observability", "ollama"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "dspy==3.4.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
service = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]
mcp = ["mcp>=2.0.0", "httpx>=0.27.0"]
observability = ["mlflow>=3.1.0"]
otel = ["opentelemetry-sdk>=1.27.0", "opentelemetry-exporter-otlp-proto-http>=1.27.0"]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-timeout>=2.3.0",
  "httpx>=0.27.0",
  "respx>=0.21.0",
  "ruff>=0.6.0",
]
all = ["dspy-jev[service,mcp,observability,otel]"]

[project.scripts]
dspy-jev = "dspy_jev.cli:main"

[project.urls]
Homepage = "https://github.com/techcwbldr26/dspy-jev"
Issues = "https://github.com/techcwbldr26/dspy-jev/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dspy_jev = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
]
markers = [
  "unit: fast, no network, no model provider",
  "contract: API/tool surface contracts and golden schemas",
  "calibration: ReAnchor calibration behaviour",
  "integration: multiple components wired together, still offline",
  "live: requires real provider credentials and network (opt-in)",
  "slow: takes more than a couple of seconds",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore:.*experimental.*:UserWarning",
]
asyncio_mode = "auto"
timeout = 120

[tool.coverage.run]
branch = true
source = ["dspy_jev"]
omit = ["*/mcp_server.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.isort]
# `tests` is a first-party package here, so its imports sort with the project's.
known-first-party = ["dspy_jev", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
