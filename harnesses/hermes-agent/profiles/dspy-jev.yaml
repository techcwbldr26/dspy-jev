# hermes-agent tool profile for the dspy-jev decision gate.
#
# The gate runs as a standalone service, so hermes-agent needs no DSPy
# dependency and no model credentials of its own -- it holds only the service
# URL and, if configured, the service API key.
#
# Field names below follow the common "OpenAPI-ish tool declaration" shape. If
# your hermes-agent build spells a key differently, the values are what matter:
# one POST to /v1/decide with three string fields, and a JSON response carrying
# `allow`, `route` and `reasons`.

name: dspy-jev
version: 0.1.0
description: >-
  Calibrated, probability-backed gate for risky agent actions. Backed by DSPy Jev
  decision types on open-weight models served by Ollama Cloud.

transport:
  kind: http
  base_url: ${DSPY_JEV_SERVICE_URL:-http://127.0.0.1:8080}
  timeout_seconds: 90
  headers:
    X-API-Key: ${DSPY_JEV_SERVICE_API_KEY:-}
  # Every request carries the agent's correlation id so service logs, MLflow
  # traces and hermes-agent's own transcript can be joined after the fact.
  propagate_headers:
    - X-Request-ID

tools:
  - name: jev_decide
    endpoint: POST /v1/decide
    description: >-
      Judge whether the agent may take one proposed action. Call before any step
      that is irreversible, outward-facing, security-relevant, or outside the
      scope of the current task. Do not call for reads and edits already in scope.
    parameters:
      task:
        type: string
        required: true
        description: What the agent was asked to accomplish, in the requester's words.
      proposed_action:
        type: string
        required: true
        description: The single concrete step the agent wants to take next.
      context:
        type: string
        required: false
        description: Branch, environment, prior steps, permissions already granted.
      autonomy_threshold:
        type: number
        required: false
        description: Per-call floor on P(safe_to_proceed). Only ever tightens the gate.
    returns:
      allow: boolean
      route: string   # auto_execute | needs_review | clarify | block
      reasons: string[]
      decisions: object  # per-field probability evidence
      rationale: string

  - name: jev_triage
    endpoint: POST /v1/triage
    description: Score a support ticket for urgency, severity and category.
    parameters:
      ticket:
        type: string
        required: true

health:
  liveness: GET /healthz
  readiness: GET /readyz
  metrics: GET /metrics

policy:
  # hermes-agent must not execute an action the gate held, whatever the model
  # that proposed it then says about it.
  on_hold: halt_and_report
  on_error: halt_and_report   # a failed gate is not permission
  binding_fields: [allow, route]
